name: Chrome public relay reachability
on:
  push:
    paths:
      - src/public-relay.js
      - src/nostr-relay.js
      - scripts/probe-browser-relays.cjs
      - .github/workflows/browser-relay-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/probe-browser-relays.cjs
