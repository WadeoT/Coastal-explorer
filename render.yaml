services:
  - type: web
    name: coastal-explorer-multiplayer
    runtime: node
    plan: free
    buildCommand: node --check server/relay.cjs && node --check server/owner-store.cjs
    startCommand: node server/relay.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: OWNER_ADMIN_TOKEN
        sync: false
